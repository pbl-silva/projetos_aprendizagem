# Servidor
server.port=8080
server.servlet.context-path=/api

# Banco de Dados (H2 para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:estacionamentodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.estacionamento_api.estacionamento=${APP_LOG_LEVEL:INFO}

# JWT
# Sem JWT_SECRET, uma chave temporária é gerada a cada inicialização.
# Em produção, defina uma chave persistente e segura na variável de ambiente.
jwt.secret=${JWT_SECRET:}
jwt.expiracao-ms=3600000

# Bootstrap apenas para desenvolvimento/demo. Em produção, desative e forneça
# credenciais por um fluxo administrativo seguro.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
