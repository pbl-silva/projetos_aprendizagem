name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes
        run: ./mvnw test -B

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

      - name: Buildar o jar
        run: ./mvnw clean package -DskipTests -B

      - name: Publicar o jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: estacionamento-jar
          path: target/*.jar

  docker-build:
    name: Build da imagem Docker
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Buildar a imagem Docker
        run: docker build -t estacionamento-api:${{ github.sha }} .

      # Para publicar a imagem em um registry (Docker Hub, GHCR, etc.),
      # adicione aqui um passo de "docker login" + "docker push" usando
      # secrets configurados no repositório (Settings > Secrets and
      # variables > Actions). Isso não foi configurado automaticamente
      # porque depende de credenciais que só você tem acesso.
