spring:
  application:
    name: ${APP_NAME:spbank-backend}
  profiles:
    default: default
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true

spbank:
  bank-code: "90001"
  zone: America/Sao_Paulo
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
  auth:
    session-hours: 8
  transfer:
    scheduler-delay: 5000
    internal:
      max-per-operation: 50000.00
    ted:
      max-per-operation: 20000.00
      fee: 4.90
      plus-free-per-month: 5
      opens-at: "06:30"
      closes-at: "17:00"

management:
  endpoints.web.exposure.include: health,info,metrics