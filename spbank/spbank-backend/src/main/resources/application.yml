spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME:spbank-backend}

  profiles:
    default: default

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true


spbank:
  bank-code: "90001"

  zone: ${SPBANK_ZONE:America/Sao_Paulo}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

  auth:
    session-hours: 8

  card:
    data-secret: ${CARD_DATA_SECRET}

  transfer:
    scheduler-delay: 5000

    internal:
      max-per-operation: 50000.00

    ted:
      max-per-operation: 20000.00
      fee: 4.90
      plus-free-per-month: 5
      opens-at: "06:30"
      closes-at: "17:00"

  pix:
    scheduler-delay: 5000
    max-per-operation: 50000.00
    favorite-required-above: 1000.00
    zone: ${spbank.zone}

  market:
    rates-url: ${MARKET_RATES_URL:https://brasilapi.com.br/api/taxas/v1}
    connect-timeout: ${MARKET_CONNECT_TIMEOUT:2s}
    request-timeout: ${MARKET_REQUEST_TIMEOUT:3s}
    cache-ttl: ${MARKET_CACHE_TTL:30m}
    failure-cache-ttl: ${MARKET_FAILURE_CACHE_TTL:1m}

  postal-code:
    base-url: ${POSTAL_CODE_BASE_URL:https://viacep.com.br/ws/}
    connect-timeout: ${POSTAL_CODE_CONNECT_TIMEOUT:2s}
    request-timeout: ${POSTAL_CODE_REQUEST_TIMEOUT:3s}
    success-cache-ttl: ${POSTAL_CODE_SUCCESS_CACHE_TTL:24h}
    not-found-cache-ttl: ${POSTAL_CODE_NOT_FOUND_CACHE_TTL:5m}
    failure-cache-ttl: ${POSTAL_CODE_FAILURE_CACHE_TTL:1m}
    max-cache-entries: ${POSTAL_CODE_MAX_CACHE_ENTRIES:1000}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
