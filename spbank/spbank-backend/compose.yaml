services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-23307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spbank}
      MYSQL_USER: ${DB_USER:-spbank}
      MYSQL_PASSWORD: ${DB_PASSWORD:-spbank123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spbankroot123}
    volumes:
      - spbank_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  spbank_mysql:
