services:
  api:
    build: .
    container_name: ecommerce-api
    ports:
      - "8080:8080"
    environment:
      # IMPORTANTE: gere um segredo forte e único para produção, por exemplo:
      # openssl rand -base64 48
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}"
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    volumes:
      - ecommerce-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8080/api/v3/api-docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ecommerce-logs:
