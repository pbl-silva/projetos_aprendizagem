# ============================================
# SERVIDOR
# ============================================
server.port=8080
server.servlet.context-path=/api
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ============================================
# ERRO HANDLING (Spring Boot 4.1.0)
# ============================================
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param
spring.web.error.include-exception=false

# ============================================
# BANCO DE DADOS (H2 - Desenvolvimento)
# ============================================
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# SWAGGER / SPRINGDOC OPENAPI
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.doc-expansion=list

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=sua-chave-secreta-super-segura-aqui-com-minimo-32-caracteres-para-producao
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# LOGGING (Spring Boot 4.1.0)
# ============================================
logging.level.root=INFO
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Padrão de log no console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Arquivo de log
logging.file.name=logs/ecommerce.log

# Rolling Policy (Spring Boot 4.1.0)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# ============================================
# JACKSON (JSON)
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# ============================================
# DEVTOOLS
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# ============================================
# PAGINAÇÃO
# ============================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.max-page-size=100

# ============================================
# PERFORMANCE
# ============================================
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_second_level_cache=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ============================================
# SEGURANÇA
# ============================================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN